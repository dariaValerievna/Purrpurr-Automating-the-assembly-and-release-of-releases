spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/release_manager
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate  # лучше использовать validate вместо update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.example.myapp.service: DEBUG
